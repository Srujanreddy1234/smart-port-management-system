<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — AI PORT</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-left">
      <div class="login-brand">
        <div class="login-brand-icon">
          <i class="fas fa-anchor"></i>
        </div>
        <h1>Smart Port <span>Mgmt System</span></h1>
        <p class="subtitle">AI-Powered Digital Command &amp; Control Center for Thoothukudi Smart Port</p>
      </div>
    </div>
    <div class="login-right">
      <div class="login-form-container">
        <div class="login-form-header">
          <h2>Set a new password</h2>
          <p>Choose a new password for your account</p>
        </div>
        <form class="login-form" id="resetForm">
          <div class="form-group">
            <label>New Password</label>
            <div class="input-icon-group">
              <i class="fas fa-lock"></i>
              <input type="password" id="newPassword" placeholder="Enter new password" minlength="8">
            </div>
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <div class="input-icon-group">
              <i class="fas fa-lock"></i>
              <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8">
            </div>
          </div>
          <button type="submit" class="btn-login">
            <i class="fas fa-check"></i> Reset Password
          </button>
        </form>
        <p style="text-align:center;margin-top:16px;">
          <a href="login.html" class="forgot-link">Back to login</a>
        </p>
        <div class="login-footer">
          <p>&copy; 2026 Smart Port Management System, Thoothukudi. All rights reserved.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('resetForm');
      const token = new URLSearchParams(window.location.search).get('token');

      function showMessage(message, isError) {
        let el = form.querySelector('.login-error');
        if (!el) {
          el = document.createElement('div');
          el.className = 'login-error';
          form.insertBefore(el, form.querySelector('.btn-login'));
        }
        el.style.cssText = isError
          ? 'color:#991b1b;font-size:0.875rem;margin-bottom:1rem;padding:8px 12px;background:#fee2e2;border-radius:6px;border:1px solid rgba(220,38,38,0.2);'
          : 'color:#166534;font-size:0.875rem;margin-bottom:1rem;padding:8px 12px;background:#dcfce7;border-radius:6px;border:1px solid rgba(22,163,74,0.2);';
        el.textContent = message;
      }

      if (!token) {
        showMessage('This reset link is missing its token. Request a new one from the login page.', true);
        form.querySelectorAll('input, button').forEach(el => el.disabled = true);
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const btn = form.querySelector('.btn-login');

        if (password.length < 8) {
          showMessage('Password must be at least 8 characters.', true);
          return;
        }
        if (password !== confirmPassword) {
          showMessage('Passwords do not match.', true);
          return;
        }

        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

        try {
          await Api.resetPassword(token, password, confirmPassword);
          showMessage('Password reset successfully. Redirecting to login...', false);
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = original;
          showMessage(err.message || 'Reset failed. The link may have expired.', true);
        }
      });
    });
  </script>
</body>
</html>
