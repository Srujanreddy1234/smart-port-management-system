<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roles & Permissions — AI PORT</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/variables.css" rel="stylesheet">
  <link href="css/main.css" rel="stylesheet">
  <link href="css/layout.css" rel="stylesheet">
  <link href="css/components.css" rel="stylesheet">
  <link href="css/pages.css" rel="stylesheet">
  <link href="css/responsive.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon"><i class="fas fa-anchor"></i></div>
      <div class="sidebar-brand-text">
        <h5>Smart Port</h5>
        <small>Thoothukudi</small>
      </div>
    </div>
    <nav class="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"></div>
        <div class="sidebar-user-info">
          <h6>Loading...</h6>
          <small></small>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <div>
          <div class="page-title">Roles &amp; Permissions</div>
          <div class="breadcrumb">
            <a href="dashboard.html">Home</a>
            <span class="separator">/</span>
            <a href="admin.html">Admin Panel</a>
            <span class="separator">/</span>
            <span>Roles &amp; Permissions</span>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <span id="liveClock" style="font-size:0.82rem;color:var(--text-muted);font-family:monospace;margin-right:8px;"></span>
        <button class="topbar-btn" id="notifBtn">
          <i class="fas fa-bell"></i>
          <span class="badge-count" id="notifBadge" style="display:none;">0</span>
        </button>
        <a href="profile.html" class="topbar-btn" style="text-decoration:none;">
          <div class="avatar avatar-sm" style="background:var(--gradient-primary);font-size:0.7rem;"></div>
        </a>
      </div>
    </header>

    <div class="page-content">
      <div class="page-header">
        <div>
          <h2>Roles &amp; Permissions</h2>
          <p>Review each role and toggle the permissions it grants</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start;">
        <div class="card" style="padding:0;">
          <div class="card-header"><h6 style="margin:0;"><i class="fas fa-user-shield" style="margin-right:8px;"></i>Roles</h6></div>
          <div id="rolesList" style="max-height:70vh;overflow-y:auto;">
            <div style="padding:24px;text-align:center;color:var(--text-muted);">Loading...</div>
          </div>
        </div>

        <div class="card" id="rolePermCard" style="display:none;">
          <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h6 style="margin:0;" id="selectedRoleName">—</h6>
              <small style="color:var(--text-muted);" id="selectedRoleDesc"></small>
            </div>
            <button class="btn btn-primary btn-sm" id="savePermsBtn" onclick="savePermissions()"><i class="fas fa-save"></i> Save Changes</button>
          </div>
          <div class="card-body" id="permGroups"></div>
        </div>
        <div class="card" id="rolePermEmpty">
          <div class="card-body" style="text-align:center;padding:48px;color:var(--text-muted);">
            <i class="fas fa-hand-pointer" style="font-size:2rem;margin-bottom:12px;display:block;"></i>
            Select a role on the left to view and edit its permissions.
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api-store.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    let allRoles = [];
    let allPermissionsGrouped = {};
    let selectedRoleId = null;
    let selectedPermissionIds = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Api.requirePermission('roles.read')) return;
      await loadRolesAndPermissions();
    });

    async function loadRolesAndPermissions() {
      try {
        const [rolesRes, permsRes] = await Promise.all([
          Api.request('/roles'),
          Api.request('/roles/permissions'),
        ]);
        allRoles = rolesRes.data.items || [];
        allPermissionsGrouped = permsRes.data.grouped || {};
        renderRolesList();
      } catch (err) {
        document.getElementById('rolesList').innerHTML = `<div style="padding:24px;color:var(--danger);">Failed to load: ${Utils.escapeHtml(err.message || '')}</div>`;
      }
    }

    function renderRolesList() {
      const list = document.getElementById('rolesList');
      if (!allRoles.length) {
        list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);">No roles found</div>';
        return;
      }
      list.innerHTML = allRoles.map(r => `
        <div class="role-list-item" data-role-id="${r.id}" onclick="selectRole(${r.id})"
             style="padding:14px 16px;border-bottom:1px solid var(--border-color);cursor:pointer;${selectedRoleId === r.id ? 'background:var(--primary-light-bg,rgba(13,110,253,0.08));' : ''}">
          <div style="font-weight:600;font-size:0.88rem;">${Utils.escapeHtml(r.display_name)}${r.is_system ? ' <span class="badge badge-secondary" style="font-size:0.65rem;">system</span>' : ''}</div>
          <div style="font-size:0.75rem;color:var(--text-muted);">${r.permissions.length} permission${r.permissions.length === 1 ? '' : 's'}</div>
        </div>
      `).join('');
    }

    function selectRole(roleId) {
      selectedRoleId = roleId;
      const role = allRoles.find(r => r.id === roleId);
      if (!role) return;
      selectedPermissionIds = new Set(role.permissions.map(p => p.id));
      renderRolesList();
      document.getElementById('rolePermCard').style.display = 'block';
      document.getElementById('rolePermEmpty').style.display = 'none';
      document.getElementById('selectedRoleName').textContent = role.display_name;
      document.getElementById('selectedRoleDesc').textContent = role.description || '';

      const canWrite = Api.hasPermission('roles.write');
      document.getElementById('savePermsBtn').style.display = canWrite ? 'inline-flex' : 'none';

      const groupsEl = document.getElementById('permGroups');
      const modules = Object.keys(allPermissionsGrouped).sort();
      groupsEl.innerHTML = modules.map(mod => `
        <div style="margin-bottom:20px;">
          <div style="font-weight:600;font-size:0.82rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;">${Utils.escapeHtml(mod)}</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;">
            ${allPermissionsGrouped[mod].map(p => `
              <label style="display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border-color);border-radius:6px;font-size:0.82rem;cursor:${canWrite ? 'pointer' : 'default'};">
                <input type="checkbox" data-perm-id="${p.id}" ${selectedPermissionIds.has(p.id) ? 'checked' : ''} ${canWrite ? '' : 'disabled'}
                       onchange="togglePermission(${p.id}, this.checked)">
                ${Utils.escapeHtml(p.name)}
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function togglePermission(permId, checked) {
      if (checked) selectedPermissionIds.add(permId);
      else selectedPermissionIds.delete(permId);
    }

    async function savePermissions() {
      if (!selectedRoleId) return;
      try {
        const res = await Api.request(`/roles/${selectedRoleId}`, {
          method: 'PUT',
          body: JSON.stringify({ permission_ids: Array.from(selectedPermissionIds) })
        });
        const idx = allRoles.findIndex(r => r.id === selectedRoleId);
        if (idx !== -1) allRoles[idx] = res.data;
        renderRolesList();
        App.showToast('Role permissions updated', 'success');
      } catch (err) {
        App.showToast(err.message || 'Failed to update role', 'danger');
      }
    }
  </script>
</body>
</html>
