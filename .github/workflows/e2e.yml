name: E2E tests (production)

on:
  schedule:
    # Nightly at 03:30 UTC (~9:00 AM IST), an off-peak hour, offset from
    # the top of the hour for the same reason keep-alive.yml is.
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  e2e:
    name: Playwright suite against production
    # Skips cleanly (not a failure) until E2E_PASSWORD is added under
    # Settings -> Secrets and variables -> Actions.
    if: secrets.E2E_PASSWORD != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 14
