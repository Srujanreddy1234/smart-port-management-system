name: E2E tests (production)

on:
  schedule:
    # Nightly at 03:30 UTC (~9:00 AM IST), an off-peak hour, offset from
    # the top of the hour for the same reason keep-alive.yml is.
    - cron: '30 3 * * *'
  workflow_dispatch: {}

jobs:
  e2e:
    name: Playwright suite against production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      # Checkout must come first and run unconditionally -- the job's
      # working-directory default is "e2e", which doesn't exist on the
      # runner until the repo is checked out. Every later step's `cd e2e`
      # (including the secret-check step) fails outright otherwise, which
      # is exactly what was happening here: the check step itself was
      # erroring before it ever got to test the secret, so the job showed
      # as a hard failure every night instead of skipping cleanly.
      - uses: actions/checkout@v4

      # The `secrets` context can't be referenced in a job/step `if:` at
      # all (GitHub Actions rejects the whole workflow file if you try),
      # so "skip until the secret exists" has to be a runtime check
      # inside a step, gating the steps after it via its output.
      - name: Check E2E secret is configured
        id: check
        run: |
          if [ -n "${{ secrets.E2E_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E_PASSWORD not set -- skipping this run. Add it under Settings > Secrets and variables > Actions to enable this job."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        if: steps.check.outputs.configured == 'true'
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npx playwright test

      - name: Upload HTML report
        if: always() && steps.check.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 14
