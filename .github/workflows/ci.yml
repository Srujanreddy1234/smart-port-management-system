name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest (SQLite in-memory, no real credentials needed)
        run: python -m pytest tests/ -q

  frontend-syntax-check:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check every js/*.js file parses
        run: |
          set -e
          for f in js/*.js; do
            echo "checking $f"
            node --check "$f"
          done

      - name: Check every page's inline <script> blocks parse
        run: |
          node -e "
            const fs = require('fs');
            const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
            let failed = false;
            for (const file of files) {
              const html = fs.readFileSync(file, 'utf8');
              const scripts = [...html.matchAll(/<script(?:(?!src)[^>]*)>([\s\S]*?)<\/script>/g)]
                .map(m => m[1]).join('\n;\n');
              if (!scripts.trim()) continue;
              try {
                new Function(scripts);
              } catch (e) {
                console.error(file, 'SYNTAX ERROR:', e.message);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log('All HTML inline scripts parse cleanly (' + files.length + ' pages checked)');
          "

  deploy:
    name: Deploy to Render
    needs: [backend-tests, frontend-syntax-check]
    # Skips cleanly (not a failure) until RENDER_API_KEY/RENDER_SERVICE_ID
    # are added under Settings -> Secrets and variables -> Actions.
    if: >
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      secrets.RENDER_API_KEY != '' && secrets.RENDER_SERVICE_ID != ''
    runs-on: ubuntu-latest
    steps:
      # Render's GitHub-push auto-deploy hook has been observed to silently
      # stop firing (a real incident: the live site sat 3 commits behind for
      # over a day with no failed-deploy signal anywhere). Triggering the
      # deploy explicitly here, only after tests pass, means a merge to main
      # is never silently un-deployed again -- this call succeeding or
      # failing is a real, visible signal in the Actions tab.
      - name: Trigger Render deploy via API
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -d '{"clearCache":"do_not_clear"}')
          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ge 400 ]; then
            echo "Render deploy trigger failed with HTTP $http_code"
            exit 1
          fi
