name: Keep Render service warm

on:
  schedule:
    # Every 10 minutes -- Render's free tier spins a service down after
    # ~15 minutes of no inbound traffic, and the next real request then
    # pays a ~30-60s cold-start penalty. A lightweight ping well inside
    # that window keeps the instance warm for real users.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://smart-port-backend.onrender.com/health
